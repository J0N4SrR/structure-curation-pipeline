[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "structure-curation-pipeline"
version = "0.1.0"
description = "Curadoria, validação e padronização estrutural de moléculas pequenas com proveniência auditável"
requires-python = ">=3.10"
dependencies = [
    "rdkit>=2023.9",
    "chembl_structure_pipeline>=1.2",
    "pydantic>=2.0",
    "streamlit>=1.30",
    "pandas>=2.0",
    "pillow>=10.0",
    "pyarrow>=24.0.0,<25.0.0",
]

[project.scripts]
curation = "curation.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.4"]
app = ["streamlit>=1.30", "pandas>=2.0", "pillow>=10.0"]
validation = ["matplotlib>=3.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"curation.components.dag" = ["frontend/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.poetry]
package-mode = false


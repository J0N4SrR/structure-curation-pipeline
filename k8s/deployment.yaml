apiVersion: apps/v1
kind: Deployment
metadata:
  name: pipeline-app
spec:
  replicas: 5
  selector:
    matchLabels:
      app: pipeline-app
  template:
    metadata:
      labels:
        app: pipeline-app
    spec:
      containers:
      - name: pipeline-app
        image: pipeline-app:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
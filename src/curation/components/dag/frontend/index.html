<!doctype html>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; height: 100%; overflow: hidden;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  #stage { width: 100%; height: 100%; display: block; cursor: grab;
    background: transparent; }
  #stage.dragging { cursor: grabbing; }
  .controls { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; }
  .controls button {
    width: 30px; height: 30px; border-radius: 6px; cursor: pointer;
    border: 1px solid rgba(128,128,128,.4); background: rgba(255,255,255,.85);
    font-size: 15px; line-height: 1; color: #202124; padding: 0;
  }
  .controls button:hover { background: #fff; }
  .node-box { cursor: pointer; }
  .node-label { font-size: 13px; font-weight: 600; }
  .node-count { font-size: 17px; font-weight: 700; }
  .node-status { font-size: 10px; opacity: .8; }
  .node-removed { font-size: 10px; }
  .hint { position: absolute; bottom: 6px; left: 10px; font-size: 11px;
    opacity: .55; }
</style>

<div class="controls">
  <button id="zoom-in" title="Aproximar" aria-label="Aproximar">+</button>
  <button id="zoom-out" title="Afastar" aria-label="Afastar">&minus;</button>
  <button id="fit" title="Ajustar a tela" aria-label="Ajustar a tela">[ ]</button>
</div>
<svg id="stage"><g id="viewport"></g></svg>
<div class="hint">Clique em um no para ver o detalhe. Arraste para mover, role para aproximar.</div>

<script>
const SVG_NS = "http://www.w3.org/2000/svg";
const stage = document.getElementById("stage");
const viewport = document.getElementById("viewport");

let view = { x: 0, y: 0, scale: 1 };
let content = { width: 1, height: 1 };
let dragging = null;
let ready = false;

// --- protocolo do Streamlit (v1, por postMessage) --------------------------
function post(message) {
  window.parent.postMessage(Object.assign({ isStreamlitMessage: true }, message), "*");
}
function announceReady() {
  post({ type: "streamlit:componentReady", apiVersion: 1 });
}
function setFrameHeight(height) {
  post({ type: "streamlit:setFrameHeight", height: height });
}
function setValue(value) {
  post({ type: "streamlit:setComponentValue", value: value, dataType: "json" });
}

// --- desenho ----------------------------------------------------------------
function el(name, attrs, text) {
  const node = document.createElementNS(SVG_NS, name);
  for (const key in attrs) node.setAttribute(key, attrs[key]);
  if (text !== undefined) node.textContent = text;
  return node;
}

function draw(payload) {
  viewport.textContent = "";
  content = { width: payload.width, height: payload.height };
  const geometry = payload.geometry;

  const marker = el("marker", {
    id: "arrow", viewBox: "0 0 10 10", refX: "9", refY: "5",
    markerWidth: "6", markerHeight: "6", orient: "auto-start-reverse"
  });
  marker.appendChild(el("path", { d: "M 0 0 L 10 5 L 0 10 z", fill: "#9aa0a6" }));
  const defs = el("defs", {});
  defs.appendChild(marker);
  viewport.appendChild(defs);

  payload.edges.forEach(function (edge) {
    viewport.appendChild(el("line", {
      x1: edge.x, y1: edge.y1, x2: edge.x, y2: edge.y2 - 8,
      stroke: "#9aa0a6", "stroke-width": "1.5", "marker-end": "url(#arrow)"
    }));
  });

  payload.nodes.forEach(function (node) {
    const selected = node.id === payload.selected;
    const group = el("g", { class: "node-box", role: "button", tabindex: "0" });
    group.setAttribute("aria-label", node.label + ": " + node.statusText);

    group.appendChild(el("rect", {
      x: node.x, y: node.y, width: geometry.nodeWidth, height: geometry.nodeHeight,
      rx: geometry.radius, fill: "rgba(127,127,127,.06)",
      stroke: selected ? "#1A73E8" : "rgba(128,128,128,.45)",
      "stroke-width": selected ? "2" : "1"
    }));
    group.appendChild(el("rect", {
      x: node.x, y: node.y, width: "4", height: geometry.nodeHeight,
      rx: "2", fill: node.color
    }));

    const left = node.x + 14;
    group.appendChild(el("text", {
      x: left, y: node.y + 22, class: "node-label", fill: "currentColor"
    }, node.glyph + "  " + node.label));
    group.appendChild(el("text", {
      x: left, y: node.y + 48, class: "node-count", fill: "currentColor"
    }, String(node.count)));
    group.appendChild(el("text", {
      x: left, y: node.y + 66, class: "node-status", fill: "currentColor"
    }, node.statusText));
    if (node.removed > 0) {
      group.appendChild(el("text", {
        x: left, y: node.y + 82, class: "node-removed", fill: node.color
      }, "-" + node.removed + " removidas"));
    }

    function choose() { setValue(node.id); }
    group.addEventListener("click", choose);
    group.addEventListener("keydown", function (event) {
      if (event.key === "Enter" || event.key === " ") { event.preventDefault(); choose(); }
    });
    viewport.appendChild(group);
  });

  apply();
}

function apply() {
  viewport.setAttribute(
    "transform",
    "translate(" + view.x + "," + view.y + ") scale(" + view.scale + ")"
  );
}

function fit() {
  const box = stage.getBoundingClientRect();
  if (!box.width || !content.width) return;
  const scale = Math.min(box.width / content.width, box.height / content.height, 1.4);
  view.scale = scale;
  view.x = (box.width - content.width * scale) / 2;
  view.y = (box.height - content.height * scale) / 2;
  apply();
}

function zoomBy(factor, originX, originY) {
  const next = Math.min(3, Math.max(0.2, view.scale * factor));
  const ratio = next / view.scale;
  view.x = originX - (originX - view.x) * ratio;
  view.y = originY - (originY - view.y) * ratio;
  view.scale = next;
  apply();
}

// --- interacao ---------------------------------------------------------------
document.getElementById("zoom-in").onclick = function () {
  const box = stage.getBoundingClientRect();
  zoomBy(1.2, box.width / 2, box.height / 2);
};
document.getElementById("zoom-out").onclick = function () {
  const box = stage.getBoundingClientRect();
  zoomBy(1 / 1.2, box.width / 2, box.height / 2);
};
document.getElementById("fit").onclick = fit;

stage.addEventListener("wheel", function (event) {
  event.preventDefault();
  const box = stage.getBoundingClientRect();
  zoomBy(event.deltaY < 0 ? 1.1 : 1 / 1.1, event.clientX - box.left, event.clientY - box.top);
}, { passive: false });

stage.addEventListener("mousedown", function (event) {
  dragging = { x: event.clientX - view.x, y: event.clientY - view.y };
  stage.classList.add("dragging");
});
window.addEventListener("mousemove", function (event) {
  if (!dragging) return;
  view.x = event.clientX - dragging.x;
  view.y = event.clientY - dragging.y;
  apply();
});
window.addEventListener("mouseup", function () {
  dragging = null;
  stage.classList.remove("dragging");
});

// --- ciclo de vida ------------------------------------------------------------
let lastSignature = null;
window.addEventListener("message", function (event) {
  const data = event.data;
  if (!data || data.type !== "streamlit:render") return;
  const payload = data.args && data.args.payload;
  if (!payload) return;

  const signature = JSON.stringify(payload);
  const firstDraw = lastSignature === null;
  const changed = signature !== lastSignature;
  lastSignature = signature;

  if (changed) draw(payload);
  // Reenquadra so na primeira renderizacao: refazer o fit a cada rerun
  // descartaria o zoom que o usuario ajustou.
  if (firstDraw) requestAnimationFrame(fit);
});

announceReady();
setFrameHeight(document.documentElement.clientHeight);
ready = true;
